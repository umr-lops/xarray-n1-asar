repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.1
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.0
    hooks:
      # mypy type-checks n1_asar, which imports xarray/numpy/pandas/matplotlib/
      # cartopy, so the isolated hook env needs those to resolve their types.
      # pandas has no py.typed -> pandas-stubs.
      - id: mypy
        args: []
        additional_dependencies:
          - xarray
          - numpy
          - pandas
          - pandas-stubs
          - matplotlib
          - cartopy
          - pytest

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
